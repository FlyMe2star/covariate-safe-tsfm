project: covariate-safe-tsfm
working_title: "When Covariate Routing Is Trustworthy: Applicability-Gated Input Selection for Zero-Shot Time-Series Foundation Models"
status: p1b_success_gate_failed_reproducibility_audit_pending
core_question: >-
  Can calibration-only historical utility certify the task-backbone groups in which
  dynamic covariate-policy routing is reliable, while safely falling back to a constant
  policy elsewhere?
primary_claim:
  id: C8
  statement: >-
    A calibration-certified applicability gate can improve sealed-origin covariate-policy
    routing over a strong calibration-best constant policy without changing frozen TSFM
    weights.
  status: verified_refuted_under_frozen_p1b
secondary_claims:
  - id: C9
    statement: >-
      Applicability gating improves the same historical-utility router relative to
      applying it indiscriminately in all task-backbone groups.
    status: not_inferentially_tested_fixed_sequence_stop
  - id: C10
    statement: >-
      Constant-policy fallback limits worst-group downside while the system continues
      to issue every forecast.
    status: verified_not_supported
risk_factors:
  - Only four of eight task-backbone groups are certified and Chronos-2 coverage is Rossmann-only.
  - The TimesFM-3 solar confidence lower bound is only slightly above chance.
  - The frozen router may fail to beat the strong full-candidate constant on sealed origins.
  - Recent configuration-selection and adapter work creates medium-high novelty pressure.
likely_reviewer_objections:
  - The applicability map may be dataset-specific rather than transferable.
  - Selecting applicability and fallback on the same calibration partition may overfit.
  - Exhaustive policy evaluation costs more than deployed one-policy inference.
hypotheses:
  H1:
    statement: Adding all available covariates causes practically meaningful harm for a nontrivial fraction of series-origins.
    p0_gate: harm_rate_gt_5pct >= 0.20
    required_backbones: [chronos_2, timesfm_3]
  H2:
    statement: A finite predeclared covariate-policy set contains useful headroom beyond target-only and all-covariate inference.
    p0_gate: mean_oracle_headroom >= 0.05
    required_backbones: [chronos_2, timesfm_3]
  H3:
    statement: Historical utility predicts the sign of future covariate utility above a practically useful threshold.
    p0_gate: utility_sign_auroc >= 0.65
    required_backbones: [chronos_2, timesfm_3]
candidate_method:
  name: applicability-gated historical-utility router
  training: none for the frozen forecasting backbone
  inputs: historical rolling-origin losses and availability metadata
  actions:
    - target_only
    - all_covariates
    - best_single_known_future
    - leave_one_out
    - correlation_top_k
  group_certificate:
    point_auroc_at_least: 0.60
    one_sided_95pct_lower_bound_strictly_greater_than: 0.50
    resampling_unit: [item_id, target, origin_index]
  routing: dynamic only inside certified task-backbone groups
  abstention: >-
    abstain from dynamic routing and use a calibration-selected constant input policy;
    always produce a forecast
evidence_boundaries:
  calibration: earlier rolling origins only
  evaluation: later sealed rolling origins
  forbidden:
    - evaluation-label-driven feature selection
    - tuning on official final-test outcomes
    - treating past-only covariates as known in the forecast horizon
kill_conditions:
  - P1a certifies fewer than three of eight groups or no group for either backbone.
  - The frozen gated router cannot beat calibration-selected constant policies on sealed origins.
  - Applicability abstention does not reduce worst-group downside relative to ungated routing.
p0_outcome:
  p0a_h1_cross_backbone_passed: true
  p0b_h2_cross_backbone_passed: true
  p0c_h3_precursor_cross_backbone_passed: false
  chronos_2_task_macro_auroc: 0.5486700780578626
  timesfm_3_task_macro_auroc: 0.7421419794416059
  required_auroc: 0.65
  sealed_evaluation_origins_instantiated: false
  decision: original_universal_cross_backbone_claim_stopped
reframed_hypotheses:
  H4:
    statement: >-
      Historical-utility predictability is heterogeneous by task and backbone, and a
      calibration-only confidence rule can identify applicable groups.
    p1a_gate: >-
      point AUROC >= 0.60 and one-sided 95% lower bound > 0.50 for at least three
      groups, with at least one eligible task per backbone
    evidence_status: verified_screening_not_paper_evidence
  H5:
    statement: >-
      On sealed origins, applicability-gated routing improves paired loss over both
      the ungated router and a calibration-selected constant policy.
    evidence_status: refuted_against_constant_and_not_confirmatorily_tested_against_ungated
  H6:
    statement: >-
      Abstaining from dynamic routing in uncertified groups reduces worst-group
      downside without abstaining from forecasting.
    evidence_status: not_supported_safety_failed_and_worst_group_equal
non_goals:
  - universal covariate selection
  - causal variable discovery
  - arbitration among different forecasting backbones
  - abstention from producing a forecast
